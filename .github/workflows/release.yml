name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/ci.yml'
      - 'packaging/**'
      - 'scripts/**'
      - 'windows/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/version.dart'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  metadata:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s scripts/tests
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/release.py verify --tag "$GITHUB_REF_NAME"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            python3 scripts/release.py verify
          fi

  quality:
    name: Quality
    uses: ./.github/workflows/ci.yml

  linux:
    name: Build Linux packages
    needs: metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev xvfb libgl1-mesa-dri libegl1 libgles2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build linux --release
      - run: ./scripts/package_linux.sh
      - name: Smoke test the packaged executable
        shell: bash
        run: |
          tar -xzf dist/readtrack-*-linux-x64.tar.gz -C "$RUNNER_TEMP"
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_DATA_HOME="$RUNNER_TEMP/readtrack-smoke-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/readtrack-smoke-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/readtrack-smoke-cache"
          set +e
          timeout 10s xvfb-run -a "$RUNNER_TEMP/ReadTrack/app/readtrack" > "$RUNNER_TEMP/readtrack-smoke.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/readtrack-smoke.log"
          test "$code" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: dist/*
          if-no-files-found: error

  android:
    name: Build Android APK
    needs: metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      READTRACK_ALLOW_DEBUG_SIGNING: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Configure permanent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: python
        run: |
          import base64, os
          from pathlib import Path
          for name in ['KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']:
              if not os.environ.get(name):
                  raise SystemExit(f'Missing required Android signing secret: {name}')
          Path('android/app/upload.p12').write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          # Java properties need backslashes escaped; generated passwords are URL-safe.
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          Path('android/key.properties').write_text(
              'storeFile=upload.p12\n' +
              'storePassword=' + escape(os.environ['STORE_PASSWORD']) + '\n' +
              'keyAlias=' + escape(os.environ['KEY_ALIAS']) + '\n' +
              'keyPassword=' + escape(os.environ['KEY_PASSWORD']) + '\n')
      - run: flutter build apk --release
      - name: Verify and package APK
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee "$RUNNER_TEMP/apk-signature.txt"
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]] && grep -q 'CN=Android Debug' "$RUNNER_TEMP/apk-signature.txt"; then
            echo 'Refusing to publish a debug-signed APK' >&2
            exit 1
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/readtrack-$VERSION-android.apk"
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties android/app/upload.p12
      - uses: actions/upload-artifact@v4
        with:
          name: packages-android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Build Windows installer
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --release
      - name: Package installer and ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: ./scripts/package_windows.ps1 -Version $env:VERSION
      - name: Smoke test the packaged executable
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'readtrack-smoke-roaming'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'readtrack-smoke-local'
          $folder = Join-Path $env:RUNNER_TEMP 'readtrack-unpacked'
          Expand-Archive -Path (Get-ChildItem dist\*.zip).FullName -DestinationPath $folder
          $process = Start-Process "$folder\readtrack.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "ReadTrack exited early: $($process.ExitCode)" }
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, quality, linux, android, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Installation instructions and checksums
        shell: bash
        run: |
          cp docs/INSTALL.md dist/INSTALL.md
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          folder = Path('dist')
          files = sorted(p for p in folder.iterdir() if p.is_file())
          assert len(files) == 6, [p.name for p in files]
          (folder / 'SHA256SUMS.txt').write_text(''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - name: Publish complete release
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text()
          section = text.split(f"## [{os.environ['VERSION']}]", 1)[1].split('\n## [', 1)[0]
          notes = section.split('\n', 1)[1].strip()
          notes += '\n\nSee INSTALL.md in the downloads for installation and platform requirements.\n'
          Path('release-notes.md').write_text(notes)
          PY
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "Release is already published"' "$RUNNER_TEMP/existing-release.json"
          else
            gh release create "$TAG" --verify-tag --draft --title "ReadTrack $VERSION" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
